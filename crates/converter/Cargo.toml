[package]
name = "rutile-converter"
version = "0.1.0"
description = "Conversion d'images de Rutile, sans dépendance à Tauri"
edition = "2024"
publish = false

[lib]
name = "converter"

[dependencies]
avif-decode = { version = "3.0.0", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
image = { version = "0.25.10", default-features = false, features = [
    "avif",
    "bmp",
    "gif",
    "ico",
    "jpeg",
    "png",
    "rayon",
    "tiff",
    "webp",
] }
lopdf = { version = "0.47.0", default-features = false }
resvg = "0.49.0"
rutile-i18n = { path = "../i18n" }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
vtracer = "0.6.5"
webp = { version = "0.3.1", default-features = false }
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
