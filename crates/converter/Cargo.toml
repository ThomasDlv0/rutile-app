[package]
name = "rutile-converter"
version = "0.1.0"
description = "Conversion d'images de Rutile, sans dépendance à Tauri"
edition = "2024"
publish = false

[lib]
name = "converter"

[dependencies]
avif-decode = { version = "3.0.0", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
image = { version = "0.25.10", default-features = false, features = [
    "avif",
    "bmp",
    "gif",
    "ico",
    "jpeg",
    "png",
    "rayon",
    "tiff",
    "webp",
] }
lopdf = { version = "0.47.0", default-features = false }
# Couleurs : un profil ICC (Display P3, Adobe RGB…) est ramené en sRGB ; déjà utilisé par image
moxcms = "0.8.1"
resvg = "0.49.0"
rutile-i18n = { path = "../i18n" }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
vtracer = "0.6.5"
webp = { version = "0.3.1", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate"] }

# Photos HEIC (iPhone) : lues par ImageIO, le décodeur du système
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "CFCGTypes",
    "CFData",
    "CFDictionary",
    "CFNumber",
    "CFString",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "std",
    "CGBitmapContext",
    "CGColorSpace",
    "CGContext",
    "CGImage",
] }
objc2-image-io = { version = "0.3.2", default-features = false, features = [
    "std",
    "CGImageProperties",
    "CGImageSource",
    "objc2-core-graphics",
] }

[dev-dependencies]
tempfile = "3.27.0"
