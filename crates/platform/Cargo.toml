[package]
name = "rutile-platform"
version = "0.1.0"
description = "Fonctions propres à chaque système, sans dépendance à Tauri ni code C"
edition = "2024"
publish = false

[lib]
name = "platform"

[dependencies]
arboard = "3.6.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
rutile-i18n = { path = "../i18n" }
serde = { version = "1.0.229", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "NSAnimationContext",
    "NSBitmapImageRep",
    "NSColor",
    "NSColorSampler",
    "NSColorSpace",
    "NSGlassEffectView",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImage",
    "NSImageRep",
    "NSApplication",
    "NSPasteboard",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSSharingService",
    "NSView",
    "NSWindow",
    "NSWorkspace",
    "objc2-core-foundation",
    "objc2-core-graphics",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "CFCGTypes",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "std",
    "CGImage",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSData",
    "NSDictionary",
    "NSEnumerator",
    "NSFileManager",
    "NSGeometry",
    "NSString",
    "NSURL",
    "NSValue",
] }
objc2-vision = { version = "0.3.2", default-features = false, features = [
    "std",
    "VNObservation",
    "VNRecognizeTextRequest",
    "VNRequest",
    "VNRequestHandler",
] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.12", default-features = false, features = ["tokio"] }
evdev = "0.13.2"
tokio = { version = "1", default-features = false, features = ["rt"] }
x11rb = "0.14.0"

[target.'cfg(windows)'.dependencies]
windows-future = "0.3"
windows = { version = "0.62.2", features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
