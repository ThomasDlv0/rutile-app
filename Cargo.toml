[workspace]
resolver = "3"
members = ["src-tauri", "crates/converter", "crates/platform", "crates/shake_detector"]

# Les codecs d'image sont très lents sans optimisation, même en développement et en test
[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
