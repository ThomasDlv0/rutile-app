# Tests et paquets d'installation sur macOS, Windows et Linux.
# Un tag `v*` crée en plus un brouillon de version GitHub avec les paquets.
name: Compilation

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf nasm

      # Le décodeur AVIF (rav1d) assemble du code avec nasm sur x86_64
      - uses: ilammy/setup-nasm@v1
        if: runner.os == 'Windows'

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # L'interface compilée est intégrée à l'app : elle doit exister avant clippy
      - name: Interface
        run: |
          npm test
          npm run build

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests Rust
        run: cargo test --workspace

  paquets:
    name: Paquets (${{ matrix.name }})
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
            args: --target aarch64-apple-darwin
            targets: aarch64-apple-darwin
          - name: macOS Intel
            os: macos-latest
            args: --target x86_64-apple-darwin
            targets: x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            args: ""
            targets: ""
          # Ubuntu 22.04 : une glibc assez ancienne pour que l'AppImage tourne partout (Bazzite compris)
          - name: Linux
            os: ubuntu-22.04
            args: ""
            targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf nasm

      - uses: ilammy/setup-nasm@v1
        if: runner.os != 'Linux'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          # Sans tag, les paquets restent des artefacts du workflow
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && 'v__VERSION__' || '' }}
          releaseName: Rutile v__VERSION__
          releaseDraft: true
          uploadWorkflowArtifacts: true
