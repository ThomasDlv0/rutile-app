[package]
name = "rutile"
version = "1.5.0"
description = "Images, vidéos, apps et partage sur une roue radiale"
edition = "2024"
rust-version = "1.88"

[lib]
# Le suffixe `_lib` évite un conflit de nom avec le binaire sous Windows
name = "rutile_lib"
# Pas de bibliothèque dynamique : seules les apps mobiles en ont besoin, et l'assembleur du
# décodeur AVIF (rav1d) ne peut pas y être lié sous Linux
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Logo des sites web : le même client HTTP et le même chiffrement que le module de mises à jour
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rutile-converter = { path = "../crates/converter" }
rutile-platform = { path = "../crates/platform" }
rutile-shake-detector = { path = "../crates/shake_detector" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = ["image-png", "macos-private-api", "tray-icon"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-notification = "2.8.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-updater = "2.12.0"
url = "2.5"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = "2.1.1"

